name: Build Motrix NVDA test package

on:
  push:
    branches:
      - motrix-nvda-build-20260917
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout patch files
        uses: actions/checkout@v4

      - name: Download official Motrix 1.8.19 portable package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/agalwood/Motrix/releases/download/v1.8.19/Motrix-1.8.19-win.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'Motrix-1.8.19-win.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          if ((Get-Item $zip).Length -lt 90000000) { throw 'Downloaded Motrix archive looks incomplete.' }
          Write-Host "Downloaded $((Get-Item $zip).Length) bytes"

      - name: Extract official package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP 'Motrix-1.8.19-win.zip'
          $root = Join-Path $env:RUNNER_TEMP 'motrix-package'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $root -Force
          $asar = Get-ChildItem -Path $root -Filter 'app.asar' -Recurse | Select-Object -First 1
          if (-not $asar) { throw 'resources/app.asar not found in official package.' }
          "MOTRIX_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MOTRIX_ASAR=$($asar.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "app.asar: $($asar.FullName)"

      - name: Install ASAR tooling
        shell: pwsh
        run: npm install --global @electron/asar@3.2.17

      - name: Inject NVDA accessibility runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $unpacked = Join-Path $env:RUNNER_TEMP 'motrix-app-asar'
          if (Test-Path $unpacked) { Remove-Item $unpacked -Recurse -Force }
          asar extract $env:MOTRIX_ASAR $unpacked

          $htmlFiles = Get-ChildItem -Path $unpacked -Filter '*.html' -Recurse
          Write-Host 'HTML candidates:'
          $htmlFiles | ForEach-Object { Write-Host $_.FullName }

          $target = $null
          foreach ($html in $htmlFiles) {
            $raw = Get-Content -LiteralPath $html.FullName -Raw
            if ($raw -match 'id=["'']app["'']' -or $raw -match '<div[^>]+id=["'']app') {
              $target = $html
              break
            }
          }
          if (-not $target) {
            $target = $htmlFiles | Select-Object -First 1
          }
          if (-not $target) { throw 'No renderer HTML file found inside app.asar.' }

          $scriptSource = Join-Path $PWD 'tools\motrix-nvda-accessibility.js'
          if (-not (Test-Path $scriptSource)) { throw 'NVDA accessibility patch script is missing.' }
          $scriptDest = Join-Path $target.Directory.FullName 'motrix-nvda-accessibility.js'
          Copy-Item $scriptSource $scriptDest -Force

          $content = Get-Content -LiteralPath $target.FullName -Raw
          $tag = '<script src="./motrix-nvda-accessibility.js"></script>'
          if ($content -notmatch 'motrix-nvda-accessibility\.js') {
            if ($content -match '</body>') {
              $content = $content -replace '</body>', ($tag + '</body>')
            } else {
              $content += $tag
            }
            Set-Content -LiteralPath $target.FullName -Value $content -Encoding utf8 -NoNewline
          }

          Write-Host "Injected accessibility patch into $($target.FullName)"
          if ((Get-Content -LiteralPath $target.FullName -Raw) -notmatch 'motrix-nvda-accessibility\.js') {
            throw 'Renderer HTML injection verification failed.'
          }

          $newAsar = Join-Path $env:RUNNER_TEMP 'app-patched.asar'
          if (Test-Path $newAsar) { Remove-Item $newAsar -Force }
          asar pack $unpacked $newAsar
          if ((Get-Item $newAsar).Length -lt 1000000) { throw 'Repacked app.asar looks incomplete.' }
          Copy-Item $newAsar $env:MOTRIX_ASAR -Force

          $verify = (asar list $env:MOTRIX_ASAR) -join "`n"
          if ($verify -notmatch 'motrix-nvda-accessibility\.js') { throw 'Patched script is missing from repacked app.asar.' }
          Write-Host 'ASAR verification passed.'

      - name: Assemble NVDA-3 portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          $zip = Join-Path $dist 'Motrix-1.8.19-NVDA-3-win.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $env:MOTRIX_ROOT '*') -DestinationPath $zip -CompressionLevel Optimal
          if ((Get-Item $zip).Length -lt 90000000) { throw 'Final package looks incomplete.' }
          Write-Host "Final package: $zip ($((Get-Item $zip).Length) bytes)"

      - name: Upload Motrix NVDA-3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Motrix-1.8.19-NVDA-3-win
          path: dist/Motrix-1.8.19-NVDA-3-win.zip
          if-no-files-found: error
          retention-days: 7
